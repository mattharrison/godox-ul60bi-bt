[project]
name = "godox-ul60bi-bt"
version = "1.1.0"
description = "Python BLE CLI library for controlling the Godox UL60Bi Lite LED light via Bluetooth Mesh proxy"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Matt Harrison"}]
keywords = ["godox", "bluetooth", "ble", "mesh", "led", "lighting"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Topic :: System :: Hardware",
]
dependencies = [
    "bleak>=3.0.2",
    "cryptography>=47.0.0",
]

[project.urls]
Homepage = "https://github.com/mattharrison/godox-ul60bi-bt"
Repository = "https://github.com/mattharrison/godox-ul60bi-bt"
"Bug Tracker" = "https://github.com/mattharrison/godox-ul60bi-bt/issues"

[project.scripts]
godox-ul60bi = "godox_ul60bi_bt.cli:run"
godox-parse-capture = "godox_ul60bi_bt.research.parse_capture:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prek>=0.3.11",
    "pytest>=9.0.3",
    "pytest-asyncio",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
